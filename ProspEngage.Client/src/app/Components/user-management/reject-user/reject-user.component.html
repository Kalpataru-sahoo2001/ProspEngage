<div class="reject-dialog-overlay">
    <div class="reject-dialog">
      <h3>Are you sure you want to reject this user?</h3>
      <p>This action will send a rejection email to the user.</p>
      <div class="dialog-actions">
        <button class="btn confirm-btn" (click)="onConfirm()">Reject</button>
        <button class="btn cancel-btn" (click)="onCancel()">Cancel</button>
      </div>
    </div>
  </div>
